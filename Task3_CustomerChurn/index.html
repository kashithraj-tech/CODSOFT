<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Churn Prediction</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🏦 Customer Churn Prediction System</h1>

<p class="subtitle">
AI Powered Customer Retention Dashboard
</p>

<form action="/predict" method="POST">

<div class="grid">

<div class="card">

<h2>Customer Details</h2>

<label>Credit Score</label>
<input type="number" name="credit_score" required>

<label>Age</label>
<input type="number" name="age" required>

<label>Tenure</label>
<input type="number" name="tenure" required>

<label>Balance</label>
<input type="number" step="0.01" name="balance" required>

<label>Estimated Salary</label>
<input type="number" step="0.01" name="salary" required>

</div>

<div class="card">

<h2>Customer Profile</h2>

<label>Geography</label>

<select name="geography">

<option>France</option>

<option>Germany</option>

<option>Spain</option>

</select>

<label>Gender</label>

<select name="gender">

<option>Male</option>

<option>Female</option>

</select>

<label>Number of Products</label>

<select name="products">

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

</select>

<label>Has Credit Card?</label>

<select name="creditcard">

<option value="1">Yes</option>

<option value="0">No</option>

</select>

<label>Active Member?</label>

<select name="active">

<option value="1">Yes</option>

<option value="0">No</option>

</select>

</div>

</div>

<div class="center">

<button type="submit">

Predict Churn

</button>

</div>

</form>

{% if prediction %}

<div class="result">

<h2>{{ prediction }}</h2>

<h3>Probability : {{ probability }}%</h3>

<h3>Risk Level : {{ risk }}</h3>

<p>{{ recommendation }}</p>

</div>

{% endif %}

<div class="graphs">

<h2>Model Analysis</h2>

<img src="{{ url_for('static', filename='feature_importance.png') }}">

<img src="{{ url_for('static', filename='model_comparison.png') }}">

<img src="{{ url_for('static', filename='confusion_matrix.png') }}">

</div>

</div>

</body>

</html>
